# config/tuned_lens.yaml
# Tuned Lens (Fase 4). Decisões confirmadas pela autora em 2026-10-28
# (reports/verified_values.md):
#   - implementação própria para os quatro modelos (o pacote tuned-lens
#     0.2.0 só reconhece LlamaModel e não tem o softcap do Gemma 2)
#   - corpus FineWeb-2 (pt, de, it, fr) + FineWeb sample-10BT (en),
#     mesma quantidade de tokens por idioma
#   - documentos que citam candidatos ou fatos ficam fora
#   - 16M tokens por modelo (250 passos × 2^16 tokens)
#
# Receita igual à do pacote tuned-lens 0.2.0 (scripts/train_loop.py,
# scripts/ingredients.py, nn/lenses.py): tradutor afim por camada
# h + A·h + b, A e b começam em zero (= Logit Lens); perda
# KL(final ‖ lens) na mesma posição; SGD Nesterov, momento 0.9,
# lr = 1.0 · (1 − 0.9), weight decay 1e-3, sem warmup, decaimento linear,
# gradiente cortado em norma global 1.0 antes de cada passo
# (train_loop.py, linha 430).
#
# Versão da receita (logit_lens/lens_training.py RECIPE_VERSION):
#   1  até 2026-10-29: SEM o corte do gradiente. O primeiro passo era
#      ~140× maior que o do pacote e as últimas camadas terminavam piores
#      que o Logit Lens (reports/results_checks.md §1). Lentes da versão 1
#      são arquivadas em lenses_stale/ e retreinadas automaticamente.
#   2  2026-10-30: com o corte (max_grad_norm), decisão da autora.
# O hash da receita (hiperparâmetros abaixo + corpus + versão) vai para
# lenses/{modelo}/RECIPE, config.json e PACK_INFO.json.

models: [llama, mistral, qwen, gemma]     # modelos instruct (chaves de models.yaml)

lens_dir: lenses                          # lenses/{modelo}/ (fora do git)

# Lentes pré-treinadas para estes checkpoints exatos e corpus multilíngue:
# nenhuma encontrada (verificado em 2026-10-28, reports/verified_values.md).
# Uma entrada {modelo: descrição} faz train_tuned_lens.py pular o modelo;
# os arquivos vão em lenses/{modelo}/ (translators.pt, config.json).
pretrained: {}

corpus:
  # dataset, config, split e commit fixo no Hugging Face; coluna de texto
  # e de id (o id decide o held-out)
  pt: {dataset: HuggingFaceFW/fineweb-2, config: por_Latn, split: train,
       revision: af9c13333eb981300149d5ca60a8e9d659b276b9, text: text, id: id}
  en: {dataset: HuggingFaceFW/fineweb, config: sample-10BT, split: train,
       revision: 9bb295ddab0e05d785b879661af7260fed5140fc, text: text, id: id}
  de: {dataset: HuggingFaceFW/fineweb-2, config: deu_Latn, split: train,
       revision: af9c13333eb981300149d5ca60a8e9d659b276b9, text: text, id: id}
  it: {dataset: HuggingFaceFW/fineweb-2, config: ita_Latn, split: train,
       revision: af9c13333eb981300149d5ca60a8e9d659b276b9, text: text, id: id}
  fr: {dataset: HuggingFaceFW/fineweb-2, config: fra_Latn, split: train,
       revision: af9c13333eb981300149d5ca60a8e9d659b276b9, text: text, id: id}

# Held-out: documentos com sha256(id) mod held_out_mod == 0 (1%), em todos
# os idiomas; nunca entram no treino
held_out_mod: 100

# Filtro: fora todo documento que cita nome de candidato (qualquer caso,
# qualquer idioma) ou palavra-chave de fato (fronteira de palavra, sem
# acento/caixa)
filter_fact_terms: true
# As quatro lentes treinadas (2026-10-29) usaram os nomes de então
# (lenses/*/config.json meta.filter_terms_sha256). Os nomes acrescentados
# em 2026-10-30 (Joseph, Dimitri, Dmitry, Alexandre, Alessandro, Conrad,
# Timothy, Julius) não estavam no filtro do corpus delas; as lentes foram
# mantidas (decisão da autora, reports/verified_values.md). Um novo treino
# usaria o filtro com os nomes atuais.

training:
  num_steps: 250
  tokens_per_step: 65536        # 2^16
  seq_len: 2048                 # sequências empacotadas, separador eos
  loss_chunk_tokens: 512        # posições por pedaço na perda (limita VRAM)
  lr: 0.1                       # = lr_scale 1.0 · (1 − momento)
  momentum: 0.9
  nesterov: true
  weight_decay: 0.001
  translator_dtype: float32
  checkpoint_every: 10          # passos
  seed: 42
  max_grad_norm: 1.0            # corte do gradiente (norma global), como no pacote

# Teste de aceitação depois da avaliação held-out (train_tuned_lens.py).
# A lente é reprovada se, na média dos idiomas, o KL do Tuned Lens passar
# o do Logit Lens + tolerância na última camada traduzida (L−1) ou na
# média da zona de decisão. Reprovada: o relatório vai para
# {modelo}_eval_rejected.csv (não {modelo}_eval.csv), o status para
# {modelo}_status.json, o script sai com código 4 e a remedição não roda.
# Para um modelo reprovado, a autora decidiu tentar 2^18 tokens por passo
# (python train_tuned_lens.py --model M --tokens-per-step 262144).
acceptance:
  tolerance_nats: 0.05

eval:
  tokens_per_language: 65536    # held-out, KL por camada e idioma
