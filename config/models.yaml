# config/models.yaml
# Registro de modelos (Fase 3). IDs, licenças, gating e commits
# confirmados pela autora em 2026-10-28 (reports/verified_values.md).
#
# kind:          base (só formato completion) | instruct (completion + QA)
# base_model:    chave do modelo de onde este foi derivado (instruct ->
#                base; Sabiá -> LLaMA-1-7B); null se não está no registro
# adaptation:    idioma de adaptação continuada (Sabiá: pt)
# architecture:  model_type esperado; define a cabeça de saída (abaixo)
# revision:      commit fixo no Hugging Face (from_pretrained revision=)
# precision:     bfloat16 | float16 | float32
# quantization:  null ou uma chave de `quantization`

architectures:
  # Caminhos de atributo (a partir do modelo *ForCausalLM) da norm final
  # e da matriz de unembedding; softcap = atributo do config com o
  # softcapping final dos logits (Gemma 2), se houver
  llama:   {final_norm: model.norm, unembedding: lm_head, softcap: null}
  mistral: {final_norm: model.norm, unembedding: lm_head, softcap: null}
  qwen2:   {final_norm: model.norm, unembedding: lm_head, softcap: null}
  gemma2:  {final_norm: model.norm, unembedding: lm_head, softcap: final_logit_softcapping}

quantization:
  # bitsandbytes 4-bit NF4; o lm_head (embeddings de saída) fica sem
  # quantizar (transformers.quantizers.base.get_keys_to_not_convert)
  nf4:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: false

