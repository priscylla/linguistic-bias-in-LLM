# status: real (existe, mesmo se a atribuição é errada) | invented (não
# corresponde a uma pessoa real) | unclear (nome deturpado ou não
# verificável). Classificação da revisão de 2026-10-30, a conferir.
# Formas: mesmas regras das formas de superfície (fronteira de palavra,
