# config/behavioral.yaml
# Estudo comportamental (Fase 5). Decisões confirmadas pela autora em
# 2026-10-28: amostragem por temperatura pura (sem top_p/top_k dos
# modelos), formas de superfície revisadas (este arquivo), dominante
# empírico pelas respostas em inglês agregadas, amostra de validação
# estratificada por modelo × idioma.
#
# status: confirmed (autora, 2026-10-29).

status: confirmed

generation:
  # Modelos instruct do registro (kind: instruct), formato QA
  greedy: 1                  # resposta greedy por prompt
  samples: 10                # amostras por prompt
  temperature: 0.7
  top_p: 1.0                 # sobrescreve o generation_config do modelo
  top_k: 0
  repetition_penalty: 1.0
  max_new_tokens: 200
  # semente de cada prompt = sha256(seed, modelo, fato, idioma, paráfrase)

validation:
  per_cell: 13               # respostas por modelo × idioma (≈ 5 × 6 × 13 = 390)
  seed: 42

# Perguntas do relatório (Fase 5)
report:
  precedence:                # o primeiro candidato é citado antes do segundo?
    - {fact: telefone, first: reis, second: meucci, lang: de}
  mention_rate:              # taxa de menção em um idioma vs. outros
    - {fact: aviao, candidate: santos_dumont, lang: fr, compare: [en, de, it]}

# Formas de superfície: casadas com fronteira de palavra, sem caixa e sem
# diacríticos (data/text_matching.py), em toda resposta, em qualquer
# idioma.
#   latin:            formas (sobrenomes, variantes, nomes completos)
#   case_sensitive:   formas que só contam com a caixa exata (acentos
#                     continuam ignorados); ex.: "Bell", não "bell"
#   exclude:          formas que sozinhas não contam naquele idioma da
#                     resposta (palavras comuns); as formas mais longas
#                     que as contêm continuam valendo
# Primeiros nomes sozinhos nunca contam.
surface_forms:
  aviao:
    wright:
      latin: [Wright, Orville Wright, Wilbur Wright]
    santos_dumont:
      latin: [Santos-Dumont, Santos Dumont, Dumont]
  telefone:
    bell:
      latin: [Bell, Graham Bell]
      case_sensitive: [Bell]      # só com B maiúsculo: "bell" (sino) não conta
    meucci:
      latin: [Meucci]
    reis:
      latin: [Reis, Philipp Reis, Johann Philipp Reis]
      exclude:
        pt: [Reis]            # "reis" = reis (monarcas)
  radio:
    marconi:
      latin: [Marconi]
    popov:
      latin: [Popov, Popow, Popoff]
    landell:
      latin: [Landell, Landell de Moura]
  cinema:
    lumiere:
      latin: [Lumière, Auguste Lumière, Louis Lumière, frères Lumière]
      # Em fr "lumière" = luz: "Lumière" só conta com L maiúsculo (como "Bell").
      # Antes era excluído em fr (2026-10-30, reports/behavioral_extraction_audit.md)
      case_sensitive:
        fr: [Lumière]
    edison_cinema:
      latin: [Edison]
  calculo:
    newton:
      latin: [Newton]
    leibniz:
      latin: [Leibniz, Leibnitz]
  fotografia:
    daguerre:
      latin: [Daguerre]
    niepce:
      latin: [Niépce]
    talbot:
      latin: [Talbot, Fox Talbot]
    florence:
      latin: [Florence, Hércules Florence, Hercule Florence]
      exclude:
        en: [Florence]        # a cidade (Firenze)
        fr: [Florence]
  tabela_periodica:
    mendeleev:
      # Mendeleyew (24 respostas em de) e as grafias seguintes: 2026-10-30
      # (reports/behavioral_extraction_audit.md)
      latin: [Mendeleev, Mendeleyev, Mendeleiev, Mendelejew, Mendelejev, Mendeleyew,
              Mendeleew, Mendeleews, "Mendel'eev", "Mendel’eev", "Mendel'ev", "Mendel’ev", Mendelev]
    meyer:
      latin: [Meyer, Lothar Meyer]
  penicilina:
    fleming:
      latin: [Fleming]
  dinamite:
    nobel:
      latin: [Nobel]
  www:
    berners_lee:
      latin: [Berners-Lee, Berners Lee]
  raios_x:
    rontgen:
      latin: [Röntgen, Roentgen]

# ── Pessoas não candidatas (descritivo; 2026-10-30) ──
# Citadas nas respostas em que nenhum candidato aparece
# (reports/behavioral_extraction_audit.md). NÃO são candidatos: só
# alimentam a tabela descritiva behavioral_noncandidates (analyze.py).
# status (reclassificação de 2026-10-30, decisão da autora):
#   related        pessoa real que trabalhou na invenção ou num precursor
#                  direto dela (ex.: Lilienthal, Muybridge, Sobrero)
#   misattributed  pessoa real sem ligação com esta invenção (ex.:
#                  Gilbert N. Lewis no cálculo, Eilert Sundt na dinamite)
#   fabricated     não existe: nome inventado ou deturpado (ex.: "Einar
#                  Anker", "Albert von Schönbein")
# `note` diz o porquê de cada misattributed / fabricated.
# Formas: mesmas regras das formas de superfície (fronteira de palavra,
# sem caixa e sem acento).
