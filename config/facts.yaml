# config/facts.yaml
# Fatos, candidatos, stakes e indicadores de narrativa.
#
# status: proposed  -> valores ainda não confirmados pela autora; nenhum
#                      run usa um fato que não esteja "confirmed"
#         confirmed -> confirmado (registrado em reports/verified_values.md)
#
# names: nomes únicos (sobrenome, prenome, partes de nomes compostos) por
#   idioma. São a unidade de medida: o Logit Lens lê um token por posição.
#   Em ru os nomes são declinados: {nom, gen, ins}, e cada prompt declara
#   o caso que a sua lacuna exige (slot_case em prompts.yaml).
# stakes: [{language, type}], type ∈ {nationality, place_of_event}
# indicators: palavras que sinalizam a narrativa (artefato, lugar), sem
#   datas. Em ru, sempre no nominativo (os prompts de indicador têm
#   lacuna nominativa).
# empirical_dominant: preenchido na Fase 5 (maioria comportamental em en)
# pending_ru_review: formas russas (nomes) ainda sem revisão nativa; o
#   fato pode estar confirmado, mas runs com prompts em ru esperam essa
#   revisão (como os próprios prompts ru)
# notes: informações sobre as escolhas (as decisões estão em
#   reports/verified_values.md)

