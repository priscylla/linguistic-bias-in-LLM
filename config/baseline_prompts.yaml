# config/baseline_prompts.yaml
# Linha de base neutra (Fase 2): prompts sobre temas sem relação com os
# fatos, com o mesmo formato de lacuna dos prompts reais. Medem os mesmos
# tokens de candidatos, para separar "o modelo pensa no candidato" de
# "o token é só frequente no idioma" (ex.: " Santos" em português).
#
# Pareamento: a paráfrase i de cada tipo espelha a paráfrase i do mesmo
# tipo e idioma em prompts.yaml (mesmo final de lacuna, mesmo
# article_blocked). A validação confere esse espelhamento.
#
#   nomes (F1–F3, QA): "o romance" / "o autor do romance"
#   place:             "a ponte"
#   artifact:          "o primeiro navio"
#
# status: confirmed (autora, 2026-10-29). PT e EN aprovados; FR, DE e IT
# aprovados depois de uma checagem não nativa da autora (review_note), sem
# revisão por falantes nativos.

